name: ImageBuild CI
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  image-build-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-nix
        with:
          gc: true
      - name: Test building the release images
        # SBOMs are generated here too so a break in the SBOM path is caught
        # pre-merge rather than on the develop push. Nothing is signed, since
        # nothing is published.
        run: RUSTFLAGS="-C debuginfo=0 -C strip=debuginfo" ./scripts/release.sh --skip-publish --build-bins --debug --no-static-linking --sbom
      - name: Test building the static binaries
        run: nix-build -A utils.debug.linux-musl.kubectl-plugin --arg incremental false
