name: Nightly CI
on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/pr-ci.yml
    secrets: inherit
  helm-pins:
    uses: ./.github/workflows/helm-pins.yml
    secrets: inherit
  nightly-ci:
    if: ${{ success() }}
    needs:
      - ci
      - helm-pins
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
