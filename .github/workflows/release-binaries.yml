name: Release Artifacts
on:
  push:
    branches:
      - 'release/**'
      - 'develop'
      - 'som-plug'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build, example: v2.9.0'
        required: true
        type: string

jobs:
  kubectl-plugin:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: "write"
      contents: "read"
      # Required to record the build provenance of the archives.
      attestations: "write"
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Update the .krew.yaml file (if required) when making changes here.
          - os: cncf-ubuntu-8-32-x86
            target: linux-musl
            arch: x86_64
          - os: cncf-ubuntu-8-32-arm
            target: linux-musl
            arch: aarch64
          - os: macos-15
            target: apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: apple-darwin
            arch: x86_64
          - os: cncf-ubuntu-8-32-x86
            target: windows-gnu
            arch: x86_64
            suffix: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - run: |
          # BUG: HEAD tag is fetched as lightweight instead of annotated
          # https://github.com/actions/checkout/issues/290
          if [ "${{ github.ref_type }}" == "tag" ]; then
            git fetch -f origin ${{ github.ref }}:${{ github.ref }}
          fi

      - uses: ./.github/actions/setup-nix
      - run: |
          TAG_ARG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_ARG="--argstr tag ${{ inputs.tag }}"
          fi
          nix-build -A utils.release.${{ matrix.arch }}.${{ matrix.target }}.kubectl-plugin --arg incremental false $TAG_ARG

      - name: Archive executable
        run: |
          # NOTE: Update the .krew.yaml file (if required) when making changes here.
          tar -czvf kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}.tar.gz LICENSE -C result/bin kubectl-mayastor${{ matrix.suffix }}

      - name: Generate the SBOM
        run: |
          ./scripts/github/kubectl-plugin-sbom.sh \
            --binary result/bin/kubectl-mayastor${{ matrix.suffix }} \
            --output kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}.cdx.json

      # Binds the archive to the workflow, repository and commit which built it,
      # keylessly, and is verified with "gh attestation verify".
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}.tar.gz

      # The SBOM travels with the archive: staging bundles whatever is here into
      # the OCI artifact, which the release then mirrors into the release assets.
      - uses: actions/upload-artifact@v7
        with:
          name: kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}.tar.gz
            kubectl-mayastor-${{ matrix.arch }}-${{ matrix.target }}.cdx.json
          if-no-files-found: error
