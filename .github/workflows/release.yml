name: Release Tagging Workflow

on:
  release:
    types: [ published ]

env:
  TAG: ${{ github.ref_name }}
  CI: 1

jobs:
  preflight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate if the release should be even made
        run: |
          nix-shell --pure --keep CI --keep TAG --run "./dependencies/control-plane/utils/dependencies/scripts/staging/validate.sh \
            --tag ${{ github.ref_name }} \
            --type release \
            --chart true" \
            ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

  release-images:
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror images from dev to Docker Hub
        run: |
          nix-shell --pure --keep CI --keep TAG --run "./dependencies/control-plane/utils/dependencies/scripts/staging/mirror-images.sh \
            --source ghcr.io/${{ github.repository_owner }}/mayastor/dev \
            --target docker.io/${{ github.repository_owner }} \
            --tag ${{ github.ref_name }} \
            --chart true" \
            ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

  release-kubectl-binaries:
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Mirror kubectl artifacts from staging
        run: |
          nix-shell --pure --keep CI --keep TAG --run "./dependencies/control-plane/utils/dependencies/scripts/staging/kubectl-oci.sh pull \
            --tag ${{ github.ref_name }} \
            --namespace ${{ github.repository_owner }}/mayastor/dev/plugin \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}" ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Upload kubectl artifacts to release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ARTIFACT_UP_DOWN }}
        run: |
          repos="mayastor-extensions mayastor-control-plane mayastor"
          ./scripts/github/release-artifacts.sh \
            --tag ${{ github.ref_name }} \
            --repo-org ${{ github.repository_owner }} \
            --upload "$repos" \
            upload

  update-krew-index:
    runs-on: ubuntu-latest
    needs: release-kubectl-binaries
    steps:
      - name: Get Latest Release Tag
        id: latest-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION=$(gh api repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          echo "Latest published version: $LATEST_VERSION"
          echo "latestTag=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Update krew index
        if: ${{ !github.event.release.prerelease && (steps.latest-release.outputs.latestTag == github.event.release.tag_name) }}
        uses: rajatjindal/krew-release-bot@v0.0.51

  release-helm-chart:
    runs-on: ubuntu-latest
    needs: [release-images, preflight-checks]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch mayastor chart
        env:
          RAW_TAG: ${{ github.ref_name }}
          IMAGE_ORG: ${{ github.repository_owner }}
        run: |
          VERSION=${RAW_TAG#v}
          echo "CHART_VERSION=$VERSION" >> $GITHUB_ENV

          rm -rf chart
          mkdir -p charts-staged charts-final chart

          CHART_REF=oci://ghcr.io/${IMAGE_ORG}/mayastor/dev/helm/mayastor
          helm pull "$CHART_REF" \
            --version ${VERSION} \
            --destination charts-staged

          tar -xzf charts-staged/mayastor-"$VERSION".tgz -C charts-final

          mv charts-final/mayastor/* chart
          git restore chart/shell.nix

      - name: Update the registry and the repository
        run: |
          nix-shell --pure --run "./scripts/helm/update-reg-repo.sh --registry docker.io --repository ${{ github.repository_owner }}" ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Generate image list
        run: nix-shell ./scripts/helm/shell.nix --run "./scripts/helm/images.sh generate --dependency-update"

      - name: Patch chart/Chart.yaml
        run: nix-shell ./scripts/helm/shell.nix --run "./scripts/helm/images.sh patch"

      - name: Publish helm chart
        uses: stefanprodan/helm-gh-pages@v1.7.0
        env:
          TMPDIR: /tmp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: .

      - name: Publish helm chart as OCI
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: mayastor
          repository: ${{ github.repository_owner }}/charts
          tag: ${{ env.CHART_VERSION }}
          path: ./chart
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: 'false'
