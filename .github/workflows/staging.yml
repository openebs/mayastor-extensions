name: Staging Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v4.2.0)'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag }}
  CI: 1

jobs:
  preflight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate if the staging should be even made
        run: |
          nix-shell --pure --keep CI --keep TAG --run "./dependencies/control-plane/utils/dependencies/scripts/staging/validate.sh \
            --tag ${TAG} \
            --type staging \
            --chart true" \
            ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix
  build-images:
    needs: preflight-checks
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.tag }}
      registry: ghcr.io
      namespace: mayastor/dev
    secrets: inherit

  build-binaries:
    needs: preflight-checks
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  push-kubectl-to-ghcr:
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      # oras logs itself in below; this is what leaves the credentials where
      # cosign can find them when it signs what oras pushed.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download kubectl artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: kubectl-mayastor-*
          merge-multiple: true

      - name: Push kubectl binaries to GHCR
        run: |
          nix-shell --pure --keep CI --keep TAG --run "./dependencies/control-plane/utils/dependencies/scripts/staging/kubectl-oci.sh push\
            --tag ${TAG} \
            --namespace ${{ github.repository_owner }}/mayastor/dev/plugin \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}" ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      # Not run under "nix-shell --pure": keyless signing needs the runner's OIDC
      # environment, and cosign the registry credentials. The tools it uses are
      # fetched from the pinned nixpkgs by the script itself.
      - name: Sign the kubectl bundle and attest its SBOMs
        run: |
          ./scripts/github/attest-kubectl-oci.sh \
            --tag ${TAG} \
            --namespace ${{ github.repository_owner }}/mayastor/dev/plugin \
            --sbom-dir artifacts

  release-staging-chart:
    runs-on: ubuntu-latest
    needs: [build-images, push-kubectl-to-ghcr]
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./scripts/helm/shell.nix

      - name: Publish locally in the workspace
        run: |
            # Note this does not commit the Chart.yaml changes this the branch
            nix-shell --pure --run "./scripts/helm/publish-chart-yaml.sh --app-tag ${{ inputs.tag }}" ./scripts/helm/shell.nix
            nix-shell --pure --run "./scripts/helm/update-reg-repo.sh --registry ghcr.io --repository ${{ github.repository_owner }}/mayastor/dev" ./scripts/helm/shell.nix
            nix-shell --pure --run "./scripts/helm/images.sh generate" ./scripts/helm/shell.nix
            nix-shell --pure --run "./scripts/helm/images.sh patch" ./scripts/helm/shell.nix

      - name: Set Chart Version
        run: |
          CHART_VERSION="${{ inputs.tag }}"
          echo "CHART_VERSION=${CHART_VERSION#v}" >> $GITHUB_ENV

      - name: Push chart to staging repo
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: mayastor
          repository: ${{ github.repository_owner }}/mayastor/dev/helm
          tag: ${{ env.CHART_VERSION }}
          path: ./chart
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: 'false'

  chart-sboms:
    runs-on: ubuntu-latest
    needs: [release-staging-chart]
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./dependencies/control-plane/utils/dependencies/scripts/staging/shell.nix

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Chart Version
        run: echo "CHART_VERSION=${TAG#v}" >> $GITHUB_ENV

      # --verify requires that every attestation found - on the chart's images,
      # ours or third-party, and on the kubectl bundle - verifies against an
      # openebs workflow identity; one signed by anybody else fails the run. An
      # image with no SBOM yet, or an unsigned one, is reported rather than
      # fatal - several of ours are still in that state, so gating on it would
      # be red every time. The default shell has no pipefail, and without it
      # the status below would be tee's, never the script's.
      - name: Collect the SBOMs of everything the chart deploys
        run: |
          set -o pipefail
          {
            echo '### Chart SBOM coverage'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          ./scripts/github/chart-sboms.sh \
            --chart oci://ghcr.io/${{ github.repository_owner }}/mayastor/dev/helm/mayastor \
            --version "${CHART_VERSION}" \
            --registry ghcr.io \
            --namespace ${{ github.repository_owner }}/mayastor/dev/plugin \
            --tag "${TAG}" \
            --verify | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sboms-${{ inputs.tag }}
          path: sboms
          if-no-files-found: error
