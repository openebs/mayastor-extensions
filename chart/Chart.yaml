apiVersion: v2
name: mayastor
description: Mayastor Helm chart for Kubernetes
#icon:
#home:
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 2.8.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.8.1"

dependencies:
  - name: crds
    version: 2.8.1
    condition: crds.enabled
  - name: etcd
    repository: https://charts.bitnami.com/bitnami
    version: 8.6.0
    condition: etcd.enabled
  - name: jaeger-operator
    version: 2.50.1
    repository: https://jaegertracing.github.io/helm-charts
    condition: base.jaeger.enabled
  - name: loki-stack
    version: 2.9.11
    repository: https://grafana.github.io/helm-charts
    condition: loki-stack.enabled
  - name: nats
    version: 0.19.14
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: eventing.enabled
  - name: localpv-provisioner
    version: 4.2.0
    repository: https://openebs.github.io/dynamic-localpv-provisioner
    condition: localpv-provisioner.enabled
annotations:
  helm.sh/images: |
    - name: bats
      image: bats/bats:1.8.2
    - name: etcd
      image: docker.io/bitnami/etcd:3.5.6-debian-11-r10
    - name: promtail
      image: docker.io/grafana/promtail:2.8.3
    - name: alpine-bash
      image: docker.io/openebs/alpine-bash:4.1.0
    - name: alpine-sh
      image: docker.io/openebs/alpine-sh:4.1.0
    - name: mayastor-agent-core
      image: docker.io/openebs/mayastor-agent-core:release-2.8
    - name: mayastor-agent-ha-cluster
      image: docker.io/openebs/mayastor-agent-ha-cluster:release-2.8
    - name: mayastor-agent-ha-node
      image: docker.io/openebs/mayastor-agent-ha-node:release-2.8
    - name: mayastor-api-rest
      image: docker.io/openebs/mayastor-api-rest:release-2.8
    - name: mayastor-csi-controller
      image: docker.io/openebs/mayastor-csi-controller:release-2.8
    - name: mayastor-csi-node
      image: docker.io/openebs/mayastor-csi-node:release-2.8
    - name: mayastor-io-engine
      image: docker.io/openebs/mayastor-io-engine:release-2.8
    - name: mayastor-metrics-exporter-io-engine
      image: docker.io/openebs/mayastor-metrics-exporter-io-engine:release-2.8
    - name: mayastor-obs-callhome-stats
      image: docker.io/openebs/mayastor-obs-callhome-stats:release-2.8
    - name: mayastor-obs-callhome
      image: docker.io/openebs/mayastor-obs-callhome:release-2.8
    - name: mayastor-operator-diskpool
      image: docker.io/openebs/mayastor-operator-diskpool:release-2.8
    - name: loki
      image: grafana/loki:2.6.1
    - name: nats
      image: nats:2.9.17-alpine
    - name: nats-box
      image: natsio/nats-box:0.13.8
    - name: nats-server-config-reloader
      image: natsio/nats-server-config-reloader:0.10.1
    - name: prometheus-nats-exporter
      image: natsio/prometheus-nats-exporter:0.11.0
    - name: linux-utils
      image: openebs/linux-utils:4.1.0
    - name: provisioner-localpv
      image: openebs/provisioner-localpv:4.2.0
    - name: csi-attacher
      image: registry.k8s.io/sig-storage/csi-attacher:v4.3.0
    - name: csi-node-driver-registrar
      image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
    - name: csi-provisioner
      image: registry.k8s.io/sig-storage/csi-provisioner:v3.5.0
    - name: csi-resizer
      image: registry.k8s.io/sig-storage/csi-resizer:v1.9.3
    - name: csi-snapshotter
      image: registry.k8s.io/sig-storage/csi-snapshotter:v6.3.3
    - name: snapshot-controller
      image: registry.k8s.io/sig-storage/snapshot-controller:v6.3.3
