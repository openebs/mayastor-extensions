{{- $globalTls := .Values.security.tls -}}
{{- $duration := $globalTls.autoGenerated.certManager.duration -}}
{{- $renewBefore := $globalTls.autoGenerated.certManager.renewBefore -}}
{{- if and $globalTls.enabled $globalTls.autoGenerated.enabled (eq $globalTls.autoGenerated.engine "cert-manager") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-api-rest-crt
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-rest
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  secretName: {{ include "rest_api_tls_secret_name" . }}
  commonName: {{ printf "%s-api-rest.%s.svc.%s" .Release.Name .Release.Namespace ( default "cluster.local" .Values.global.clusterDomain) }}
  issuerRef:
    name: {{ printf "%s-tls-ca-issuer" .Release.Name }}
    kind: Issuer
  subject:
    organizations:
      - "OpenEBS"
  dnsNames:
    - localhost
    - {{ .Release.Name }}-api-rest
    - {{ .Release.Name }}-api-rest.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-api-rest.{{ .Release.Namespace }}.svc.cluster.local
    {{- if .Values.global.clusterDomain }}
    - {{ .Release.Name }}-api-rest.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}
    {{- end }}
  usages:
    - server auth
  privateKey:
    algorithm: {{ $globalTls.autoGenerated.certManager.keyAlgorithm }}
    size: {{ int $globalTls.autoGenerated.certManager.keySize }}
  duration: {{ $duration }}
  renewBefore: {{ $renewBefore }}
{{- end -}}
