{{- include "validate_tls_mode" . -}}
{{- if eq .Values.tls.mode "selfSigned" -}}
{{- /* Generate a self-signed TLS certificate for api-rest when cert-manager is not available.
     The existing Secret is preserved across helm upgrades via lookup so that pods are not
     needlessly restarted on every `helm upgrade`. */}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "rest_api_tls_secret_name" .) -}}
{{- $cert := "" -}}
{{- $key := "" -}}
{{- if and $existingSecret $existingSecret.data (index $existingSecret.data "tls.crt") -}}
  {{- $cert = index $existingSecret.data "tls.crt" | b64dec -}}
  {{- $key = index $existingSecret.data "tls.key" | b64dec -}}
{{- else -}}
  {{- $dnsSANs := list
        (printf "%s-api-rest" .Release.Name)
        (printf "%s-api-rest.%s.svc" .Release.Name .Release.Namespace)
        (printf "%s-api-rest.%s.svc.cluster.local" .Release.Name .Release.Namespace) -}}
  {{- $generated := genSelfSignedCert (printf "%s-api-rest" .Release.Name) (list) $dnsSANs 3650 -}}
  {{- $cert = $generated.Cert -}}
  {{- $key = $generated.Key -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rest_api_tls_secret_name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-rest
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc }}
  tls.key: {{ $key | b64enc }}
  ca.crt: {{ $cert | b64enc }}
{{- end -}}
{{- if eq .Values.tls.mode "certManager" -}}
{{- /* cert-manager resources for the api-rest TLS certificate.
     Requires cert-manager (https://cert-manager.io) to be installed in the cluster.
     When tls.certManager.issuerRef.name is empty, a SelfSigned Issuer is created automatically. */}}
{{- if not (or (eq .Values.tls.certManager.issuerRef.kind "Issuer") (eq .Values.tls.certManager.issuerRef.kind "ClusterIssuer")) -}}
{{- fail (printf "tls.certManager.issuerRef.kind must be one of: Issuer, ClusterIssuer (got: %q)" .Values.tls.certManager.issuerRef.kind) -}}
{{- end -}}
{{- if not .Values.tls.certManager.issuerRef.name }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-api-rest-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-rest
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-api-rest-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-rest
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  secretName: {{ include "rest_api_tls_secret_name" . }}
  duration: {{ .Values.tls.certManager.duration | quote }}
  renewBefore: {{ .Values.tls.certManager.renewBefore | quote }}
  dnsNames:
    - {{ .Release.Name }}-api-rest
    - {{ .Release.Name }}-api-rest.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-api-rest.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.tls.certManager.issuerRef.name | default (printf "%s-api-rest-issuer" .Release.Name) }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
{{- end -}}
