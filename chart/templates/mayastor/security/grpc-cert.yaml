{{- $tls := .Values.security.tls -}}
{{- if and $tls.enabled $tls.autoGenerated.enabled (eq $tls.autoGenerated.engine "cert-manager") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "grpc_tls_secret_name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: grpc
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  secretName: {{ include "grpc_tls_secret_name" . }}
  commonName: {{ printf "%s-grpc" .Release.Name }}
  issuerRef:
    name: {{ printf "%s-tls-ca-issuer" .Release.Name }}
    kind: Issuer
  subject:
    organizations:
      - "OpenEBS"
  # gRPC peers are authenticated by CA membership, not hostname (components are
  # reached over dynamic pod IPs), so this certificate carries no DNS SANs.
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: {{ $tls.autoGenerated.certManager.keyAlgorithm }}
    size: {{ int $tls.autoGenerated.certManager.keySize }}
  duration: {{ $tls.autoGenerated.certManager.duration }}
  renewBefore: {{ $tls.autoGenerated.certManager.renewBefore }}
{{- end -}}
