{{- include "validate_tls_mode" . -}}
{{- $globalTls := .Values.security.tls -}}
{{- if and $globalTls.enabled $globalTls.autoGenerated.enabled (eq $globalTls.autoGenerated.engine "cert-manager") }}
{{- if empty $globalTls.autoGenerated.certManager.existingIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-tls-clusterissuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls-ca-crt
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  secretName: {{ .Release.Name }}-tls-ca-root
  duration: {{ $globalTls.autoGenerated.certManager.caDuration | quote }}
  isCA: true
  commonName: {{ .Release.Name }}-tls-ca-root
  issuerRef:
    name: {{ default (printf "%s-tls-clusterissuer" .Release.Name) $globalTls.autoGenerated.certManager.existingIssuer }}
    kind: {{ default "Issuer" $globalTls.autoGenerated.certManager.existingIssuerKind }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-tls-ca-issuer" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
spec:
  ca:
    secretName: {{ .Release.Name }}-tls-ca-root
{{- end }}
