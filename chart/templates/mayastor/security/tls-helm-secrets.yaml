{{- $tls := .Values.security.tls -}}
{{- $restTls := .Values.apis.rest.security.tls -}}
{{- if and $tls.enabled $tls.autoGenerated.enabled (eq $tls.autoGenerated.engine "helm") -}}
{{- $mutualAuth := dig "mutualAuth" $tls.mutualAuth $restTls -}}
{{- $caCertDuration := int ($tls.autoGenerated.helm.caCertDuration | default 3650) -}}
{{- $certDuration := $tls.autoGenerated.helm.certDuration | default 365 | int -}}

{{- /* Look up or generate the shared CA.
     The CA secret stores both cert and key so it can be reused across upgrades and when
     new services (gRPC, etc.) need leaf certs signed by the same CA.
     buildCustomCert reconstructs the CA struct that genSignedCert expects from the stored PEM.
     Note: Kubernetes secret data is already base64-encoded, so no b64dec is needed here.
     genCA is only called when no CA exists — never generate-then-maybe-overwrite, because
     if the overwrite were skipped for any reason the fresh random CA would silently replace
     the stored one, regenerating all leaf certs and breaking mTLS on the next server restart. */ -}}
{{- $caSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-tls-ca" .Release.Name) -}}
{{- $caExists := and $caSecret $caSecret.data (index $caSecret.data "ca.crt") (index $caSecret.data "ca.key") -}}
{{- $ca := "" -}}
{{- if $caExists -}}
  {{- $ca = buildCustomCert (index $caSecret.data "ca.crt") (index $caSecret.data "ca.key") -}}
{{- else -}}
  {{- $ca = genCA (printf "%s-tls-ca" .Release.Name) $caCertDuration -}}
{{- end -}}

{{- /* Shared args passed to every tls_helm_leaf_secret call. */ -}}
{{- $shared := dict "ca" $ca "caExists" $caExists "certDuration" $certDuration "ctx" . -}}

{{- /* DNS SANs cover all the ways the REST service is addressed inside the cluster. */ -}}
{{- $dnsSANs := list "localhost"
    (printf "%s-api-rest" .Release.Name)
    (printf "%s-api-rest.%s.svc" .Release.Name .Release.Namespace)
    (printf "%s-api-rest.%s.svc.cluster.local" .Release.Name .Release.Namespace)
    (printf "%s-api-rest.%s.svc.%s" .Release.Name .Release.Namespace .Values.clusterDomain) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "label_prefix" . }}/release: {{ .Release.Name }}
    {{ include "label_prefix" . }}/version: {{ .Chart.Version }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_secret_name" .) "cn" (printf "%s-api-rest" .Release.Name) "dnsSANs" $dnsSANs "app" "api-rest") $shared) | nindent 0 }}
{{- if $mutualAuth }}
{{- /* All client certs are emitted here (not in per-client files) so the CA variable is in scope
     on the very first install — lookup cannot see secrets created in the same render pass. */ -}}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_csi_controller_client_secret_name" .) "cn" (printf "%s-api-rest-csi-controller" .Release.Name) "dnsSANs" (list) "app" "csi-controller") $shared) | nindent 0 }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_csi_node_client_secret_name" .) "cn" (printf "%s-api-rest-csi-node" .Release.Name) "dnsSANs" (list) "app" "csi-node") $shared) | nindent 0 }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_callhome_client_secret_name" .) "cn" (printf "%s-api-rest-callhome" .Release.Name) "dnsSANs" (list) "app" "obs-callhome") $shared) | nindent 0 }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_metrics_exporter_client_secret_name" .) "cn" (printf "%s-api-rest-metrics-exporter" .Release.Name) "dnsSANs" (list) "app" "io-engine") $shared) | nindent 0 }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_diskpool_operator_client_secret_name" .) "cn" (printf "%s-api-rest-diskpool-operator" .Release.Name) "dnsSANs" (list) "app" "operator-diskpool") $shared) | nindent 0 }}
{{- include "tls_helm_leaf_secret" (merge (dict "secretName" (include "rest_api_tls_plugin_client_secret_name" .) "cn" (printf "%s-api-rest-plugin" .Release.Name) "dnsSANs" (list "localhost") "app" "plugin") $shared) | nindent 0 }}
{{- end }}
{{- end -}}
