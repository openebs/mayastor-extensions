[package]
name = "metrics-exporter"
description = "Metrics Exporters"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "metrics-exporter-io-engine"
path = "src/bin/io_engine/main.rs"


[dependencies]
rpc = { path = "../dependencies/control-plane/rpc" }
utils = { path = "../dependencies/control-plane/utils/utils-lib" }

actix-web = { workspace = true }
tokio = { workspace = true, features = ["full"] }
once_cell = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "string"] }
prometheus = { workspace = true }
tonic = { workspace = true }
serde = { workspace = true }
mime = { workspace = true }
tracing = { workspace = true }

# OEP-4111: Node status metrics dependencies
openapi = { path = "../dependencies/control-plane/openapi" }
anyhow = { workspace = true }
humantime = { workspace = true }
url = { workspace = true }
